name: refresh
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: commit if changed
        run: |
          git add data.csv data.json README.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="deployedbyai" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: refresh from deployedbyai.com/log/"
          git push -q
